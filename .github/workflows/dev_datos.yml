name: dev - probar corners laliga
on:
  push:
    branches: [dev-datos]
permissions:
  contents: write
jobs:
  probar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          K: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 probe_corners.py
