<title>Análisis de fútbol</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#1c2833;--sub:#5d6d7e;--linea:#e5e8eb;--acento:#0f5132;
  --goles:#7f8c8d;--rating:#2980b9;--mm:#27ae60;--mer:#e67e22;--tu:#8e44ad;--mal:#c0392b;--aviso:#b9770e}
@media (prefers-color-scheme:dark){:root{--bg:#101418;--card:#1a2026;--txt:#e8ecef;--sub:#9aa7b3;--linea:#2b333b;--acento:#4cc38a}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--acento);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
header h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 86px);max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--sub);padding:8px 1px 7px;font-size:10px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.activo{color:var(--acento);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:17px;margin:0 0 6px}.card h3{font-size:15px;margin:12px 0 6px}
.sub{color:var(--sub);font-size:13px}
.aviso{color:var(--aviso)}.error{color:var(--mal);font-weight:600}
select,input[type=text],input[type=number]{width:100%;font-size:16px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--linea);background:var(--card);color:var(--txt);margin:3px 0 8px}
label{font-size:13px;color:var(--sub)}
.fila{display:flex;gap:8px}.fila>*{flex:1;min-width:0}
button.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--acento);color:#fff;
  width:100%;margin:4px 0}
button.sec{background:transparent;color:var(--acento);border:1px solid var(--acento)}
button.peq{padding:7px 10px;font-size:13px;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--card);color:var(--txt);border-radius:16px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acento);color:#fff;border-color:var(--acento)}
.partido{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--txt);border-radius:14px;

.partido b{font-size:15px}.partido .meta{font-size:12px;color:var(--sub)}
.badge{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--linea)}
.badge.alto{background:#fdebd0;color:#935116}
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--linea);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
.barras .grupo{margin:6px 0 10px}.barras .et{font-size:13px;font-weight:600;margin-bottom:2px}
.barra{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}

.barra .relleno{height:100%;border-radius:5px}
.barra .v{width:44px;text-align:right}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}

.mapa{display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;font-size:11px}
.mapa div{text-align:center;padding:5px 0;border-radius:4px}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;margin:6px 0 2px}
.cols div{flex:1;background:#34495e;border-radius:4px 4px 0 0;position:relative}
.cols div.over{background:var(--mer)}
.cols div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.ejes{display:flex;gap:4px;font-size:11px;color:var(--sub)}.ejes span{flex:1;text-align:center}
.rango{margin:8px 0}.rango .cab{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;height:34px}

.ok{color:#1e8449;font-weight:600}

.veredicto.bien{background:rgba(39,174,96,.13)}.veredicto.mal{background:rgba(192,57,43,.13)}.veredicto.neutro{background:var(--linea)}

<script id="motor">
/* ===================== MOTOR DE CÁLCULO (sin DOM) ===================== */
var Motor = (function () {
  var G = 11;
  function clip(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function pmf(lam) {
    var out = new Array(G), p = Math.exp(-lam);
    out[0] = p;
    for (var k = 1; k < G; k++) { p = p * lam / k; out[k] = p; }
    return out;
  }
  function matriz(ll, lv, rho) {
    var a = pmf(ll), b = pmf(lv), M = [], s = 0, i, j;
    for (i = 0; i < G; i++) { M.push(new Array(G)); for (j = 0; j < G; j++) M[i][j] = a[i] * b[j]; }
    if (rho) { M[0][0] *= 1 - ll * lv * rho; M[0][1] *= 1 + ll * rho; M[1][0] *= 1 + lv * rho; M[1][1] *= 1 - rho; }
    for (i = 0; i < G; i++) for (j = 0; j < G; j++) s += M[i][j];
    for (i = 0; i < G; i++) for (j = 0; j < G; j++) M[i][j] /= s;
    return M;
  }
  function suma(M, f) {
    var s = 0;
    for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) if (f(i, j)) s += M[i][j];
    return s;
  }
  function desglosar(M) {
    var p1 = suma(M, function (i, j) { return i > j; }), px = suma(M, function (i, j) { return i === j; }),
      p2 = suma(M, function (i, j) { return i < j; }), t = p1 + px + p2;
    return { p: [p1 / t, px / t, p2 / t], ov: suma(M, function (i, j) { return i + j >= 3; }) };
  }
  function mercados(M) {
    var f = function (fn) { return suma(M, fn); };
    var p1 = f(function (i, j) { return i > j; }), px = f(function (i, j) { return i === j; }), p2 = f(function (i, j) { return i < j; });
    var out = [["1X2", "Local", p1], ["1X2", "Empate", px], ["1X2", "Visitante", p2],
      ["Doble oportunidad", "1X", p1 + px], ["Doble oportunidad", "12", p1 + p2], ["Doble oportunidad", "X2", px + p2]];
    [0.5, 1.5, 2.5, 3.5, 4.5].forEach(function (l) {
      var pm = f(function (i, j) { return i + j > l; });
      out.push(["Goles totales", "Más de " + l, pm], ["Goles totales", "Menos de " + l, 1 - pm]);
    });
    var bt = f(function (i, j) { return i >= 1 && j >= 1; });
    out.push(["Ambos marcan", "Sí", bt], ["Ambos marcan", "No", 1 - bt]);
    [0.5, 1.5].forEach(function (l) { out.push(["Goles del local", "Más de " + l, f(function (i) { return i > l; })]); });
    [0.5, 1.5].forEach(function (l) { out.push(["Goles del visitante", "Más de " + l, f(function (i, j) { return j > l; })]); });
    out.push(["Portería a cero", "Local no encaja", f(function (i, j) { return j === 0; })],
      ["Portería a cero", "Visitante no encaja", f(function (i) { return i === 0; })],
      ["Margen", "Local gana por 2 o más", f(function (i, j) { return i - j >= 2; })],
      ["Margen", "Visitante gana por 2 o más", f(function (i, j) { return j - i >= 2; })]);
    return out;
  }
  function lambdas(fz, i, j, tope) {
    tope = tope || 6;
    return [clip(fz.mu_l * fz.att[i] * fz.dfn[j], 0.05, tope), clip(fz.mu_v * fz.att[j] * fz.dfn[i], 0.05, tope)];
  }
  /* binomial negativa (k >= 1e4 = Poisson): probabilidades de 0..n */
  function nbPmf(mu, k, n) {
    var out = [], p, x;
    if (!(k < 1e4)) { p = Math.exp(-mu); out.push(p); for (x = 1; x <= n; x++) { p = p * mu / x; out.push(p); } return out; }
    p = Math.exp(k * Math.log(k / (k + mu))); out.push(p);
    for (x = 0; x < n; x++) { p = p * (x + k) / (x + 1) * (mu / (k + mu)); out.push(p); }
    return out;
  }
  function pMas(mu, k, linea) {
    var n = Math.floor(linea), pm = nbPmf(mu, k, n), s = 0;
    for (var x = 0; x <= n; x++) s += pm[x];
    return Math.max(0, 1 - s);
  }
  function conteos(D, liga, i, j) {
    var F = D.fuerzas[liga], C = D.conteos || {}, out = {}, minp = D.parametros.min_partidos;
    [["corners", "cor"], ["tarjetas", "tar"]].forEach(function (t) {
      var fz = F[t[1]], c = C[t[0]];
      if (!fz || !c || fz.n[i] < minp || fz.n[j] < minp) return;
      var lam = lambdas(fz, i, j, D.parametros.tope_conteo || 15), tot = lam[0] + lam[1];
      out[t[0]] = { nombre: c.nombre, ml: lam[0], mv: lam[1], total: tot, k_total: c.k_total, k_lado: c.k_lado,
        total_lineas: c.lineas_total.map(function (l) { return [l, pMas(tot, c.k_total, l)]; }),
        local_lineas: c.lineas_equipo.map(function (l) { return [l, pMas(lam[0], c.k_lado, l)]; }),
        visit_lineas: c.lineas_equipo.map(function (l) { return [l, pMas(lam[1], c.k_lado, l)]; }) };
    });
    return out;
  }
  function pMarcar(M) {
    var l0 = 0, v0 = 0, b = 0, i, j;
    for (j = 0; j < G; j++) l0 += M[0][j];
    for (i = 0; i < G; i++) v0 += M[i][0];
    for (i = 1; i < G; i++) for (j = 1; j < G; j++) b += M[i][j];
    return { pl: 1 - l0, pv: 1 - v0, pb: b };
  }
  function logc(p) { return Math.log(clip(p, 1e-6, 1)); }
  function softmax(sm, x) {
    var d = x.length, K = sm.W[0].length, z = [], k, i, m = -Infinity, s = 0;
    for (k = 0; k < K; k++) {
      var v = sm.W[d][k];
      for (i = 0; i < d; i++) v += ((x[i] - sm.mu[i]) / sm.sd[i]) * sm.W[i][k];
      z.push(v); if (v > m) m = v;
    }
    for (k = 0; k < K; k++) { z[k] = Math.exp(z[k] - m); s += z[k]; }
    return z.map(function (v) { return v / s; });
  }
  var _grid = null;
  function rejilla() {
    if (_grid) return _grid;
    var lam = [], k;
    for (k = 0; 0.15 + k * 0.02 < 4.52 - 1e-9; k++) lam.push(Math.round((0.15 + k * 0.02) * 100) / 100);
    var n = lam.length, LL = [], LV = [], P1 = [], P2 = [], PO = [];
    var pm = lam.map(pmf);
    for (var a = 0; a < n; a++) for (var b = 0; b < n; b++) {
      var A = pm[a], B = pm[b], p1 = 0, p2 = 0, po = 0, s = 0;
      for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) {
        var v = A[i] * B[j]; s += v;
        if (i > j) p1 += v; else if (i < j) p2 += v;
        if (i + j >= 3) po += v;
      }
      LL.push(lam[a]); LV.push(lam[b]); P1.push(p1 / s); P2.push(p2 / s); PO.push(po / s);
    }
    _grid = { LL: LL, LV: LV, P1: P1, P2: P2, PO: PO };
    return _grid;
  }
  function invertir(p1x2, pou) {
    var g = rejilla(), mejor = -1, dmin = Infinity, k, d, x, y;
    var conOU = pou && isFinite(pou[0]);
    for (k = 0; k < g.LL.length; k++) {
      if (conOU) { x = g.P1[k] - g.P2[k] - (p1x2[0] - p1x2[2]); y = g.PO[k] - pou[0]; }
      else { x = g.P1[k] - p1x2[0]; y = g.P2[k] - p1x2[2]; }
      d = x * x + y * y;
      if (d < dmin) { dmin = d; mejor = k; }
    }
    return [g.LL[mejor], g.LV[mejor]];
  }
  /* último partido antes de `fecha`: el del histórico o, si los resultados van con retraso,
     el que figure en la lista de próximos partidos entre medias */
  function ultimoAntes(D, liga, eq, fecha) {
    var u = (D.ultimo_partido[liga] && D.ultimo_partido[liga][eq]) || null;
    D.proximos.forEach(function (f) {
      if (f.liga === liga && (f.local === eq || f.visitante === eq) && f.fecha < fecha && (!u || f.fecha > u)) u = f.fecha;
    });
    return u;
  }
  function descanso(D, liga, eq, fecha) {
    var u = ultimoAntes(D, liga, eq, fecha);
    if (!u) return 7;
    var d = (Date.parse(fecha) - Date.parse(u)) / 864e5;
    if (!(d > 0)) return 7;
    return clip(d, 2, 21);
  }
  function fixture(D, liga, local, visitante) {
    for (var k = 0; k < D.proximos.length; k++) {
      var f = D.proximos[k];
      if (f.liga === liga && f.local === local && f.visitante === visitante && f.fecha >= D.hoy) return f;
    }
    return null;
  }
  function recientes(D, liga, eq) {
    var desde = new Date(Date.parse(D.hoy) - 365 * 864e5).toISOString().slice(0, 10), n = 0;
    D.partidos.forEach(function (p) { if (p[0] === liga && p[1] >= desde && (p[2] === eq || p[3] === eq)) n++; });
    return n;
  }
  function analizar(D, liga, local, visitante, fecha) {
    if (local === visitante) throw new Error("Elige dos equipos distintos.");
    var F = D.fuerzas[liga];
    if (!F || !F.gol) throw new Error("Histórico insuficiente para esta liga.");
    var i = F.equipos.indexOf(local), j = F.equipos.indexOf(visitante), avisos = [];
    [[local, i], [visitante, j]].forEach(function (t) {
      if (t[1] < 0) throw new Error(t[0] + ": no aparece en el histórico (¿recién ascendido o nombre distinto?).");
      if (F.gol.n[t[1]] < D.parametros.min_partidos) throw new Error(t[0] + ": solo " + F.gol.n[t[1]] + " partidos en el histórico.");
      var r = recientes(D, liga, t[0]);
      if (r < 10) avisos.push(t[0] + ": solo " + r + " partidos en el último año (¿recién ascendido?). Estimación poco fiable.");
    });
    var fx = fixture(D, liga, local, visitante);
    fecha = fecha || (fx ? fx.fecha : D.hoy);
    var rho = D.parametros.rho_goles, fuentes = {}, orden = [];
    var lg = lambdas(F.gol, i, j), dg = desglosar(matriz(lg[0], lg[1], rho));
    fuentes["Modelo de goles"] = { p: dg.p, ov: dg.ov, lam: lg }; orden.push("Modelo de goles");
    if (F.mkt) {
      var lr = lambdas(F.mkt, i, j), dr = desglosar(matriz(lr[0], lr[1], 0));
      fuentes["Rating de mercado"] = { p: dr.p, ov: dr.ov, lam: lr }; orden.push("Rating de mercado");
      var mod = D.modelo;
      if (mod && mod.softmax && mod.softmax["1x2"] && mod.ligas.indexOf(liga) >= 0) {
        var dl = descanso(D, liga, local, fecha), dv = descanso(D, liga, visitante, fecha);
        var dum = mod.ligas.map(function (c) { return c === liga ? 1 : 0; });
        var x1 = dg.p.map(logc).concat(dr.p.map(logc), [Math.log(Math.max(dl, 1)), Math.log(Math.max(dv, 1))], dum);
        var pmm = softmax(mod.softmax["1x2"], x1), po = null;
        if (mod.softmax.ou) {
          var x2 = [dg.ov, 1 - dg.ov].map(logc).concat([dr.ov, 1 - dr.ov].map(logc),
            [Math.log(Math.max(dl, 1)), Math.log(Math.max(dv, 1))], dum);
          po = softmax(mod.softmax.ou, x2);
        }
        fuentes["Modelo de mercado"] = { p: pmm, ov: po ? po[0] : null, lam: invertir(pmm, po) };
        orden.push("Modelo de mercado");
      }
    }
    if (fx && fx.mer1x2) {
      fuentes["Mercado (cuotas)"] = { p: fx.mer1x2, ov: fx.merou ? fx.merou[0] : null,
        lam: invertir(fx.mer1x2, fx.merou), b365: fx.b365, b365ou: fx.b365ou };
      orden.push("Mercado (cuotas)");
    }
    /* estimación principal: la que mejor predijo en el test (la decide el robot cada día) */
    var pref = D.modelo && D.modelo.principal;
    var principal = (pref && fuentes[pref]) ? pref :
      (fuentes["Modelo de mercado"] ? "Modelo de mercado" : (fuentes["Rating de mercado"] ? "Rating de mercado" : "Modelo de goles"));
    var lp = fuentes[principal].lam;
    /* "Ambos marcan" con el rating de mercado: es la misma fuente que usa el backtest de la regla */
    var fb = fuentes["Rating de mercado"] ? "Rating de mercado" : "Modelo de goles", lb = fuentes[fb].lam;
    var marca = pMarcar(matriz(lb[0], lb[1], fb === "Modelo de goles" ? rho : 0));
    marca.fuente = fb;
    return { liga: liga, local: local, visitante: visitante, fecha: fecha, fuentes: fuentes, orden: orden,
      principal: principal, avisos: avisos, fixture: fx, M: matriz(lp[0], lp[1], principal === "Modelo de goles" ? rho : 0),
      conteos: conteos(D, liga, i, j), marca: marca, i: i, j: j };
  }
  return { matriz: matriz, desglosar: desglosar, mercados: mercados, lambdas: lambdas, softmax: softmax,
    invertir: invertir, descanso: descanso, ultimoAntes: ultimoAntes, analizar: analizar, fixture: fixture,
    pMas: pMas, pMarcar: pMarcar, conteos: conteos, G: G };
})();
if (typeof module !== "undefined") module.exports = Motor;
</script>

<script id="app">
/* ===================== INTERFAZ ===================== */
(function () {
  var D = null, cache = {};
  var COL = { "Modelo de goles": "var(--goles)", "Rating de mercado": "var(--rating)", "Modelo de mercado": "var(--mm)",
    "Mercado (cuotas)": "var(--mer)", "Tu estimación": "var(--tu)" };
  var st = { tab: "jornada", filtro: "todas", liga: null, local: null, visitante: null, a: null,
    lab: { ll: 1.4, lv: 1.1, rho: -0.10 }, labA: null, ligaTabla: null };
  var CLAVE = "futbol_diario_v1", CLAVE_AP = "futbol_apuestas_v1", CLAVE_COPIA = "futbol_ultima_copia";
  var $ = function (id) { return document.getElementById(id); };
  function hoyLocal() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

          var d = diario(), ap = apuestas(), n1 = mezclar(d, pron), n2 = mezclar(ap, aps);
          guardarDiario(d); guardarApuestas(ap);
          $("d-msg").innerHTML = '<p class="ok">Importados ' + n1 + ' pronósticos y ' + n2 + ' apuestas.</p>'; setTimeout(function () { ir("diario"); }, 900);
        } catch (e) { $("d-msg").innerHTML = '<p class="error">No se pudo importar: ' + esc(e.message) + '</p>'; }
      };
      r.readAsText(f);
    };
  }

  /* ---------- fiabilidad ---------- */
  function nomTemp(t) { return String(t).slice(0, 2) + "/" + String(t).slice(2); }
  function vistaFiab() {
    var h = '<div class="card"><h2>¿Cuánto se acerca cada estimación al mercado?</h2>';
    if (D.modelo && D.modelo.metricas) {
      var info = D.modelo.info || {}, test = [].concat(info.test || []);
      h += '<p class="sub">Temporadas de prueba: ' + test.map(nomTemp).join(" y ") + ' (no se usaron para entrenar). Se compara con el <b>mercado de cierre</b> ' +
        'en los mismos partidos. Diferencia de log loss: positiva = peor que el cierre; si el intervalo no incluye el 0, la diferencia es real y no suerte.</p>' +
        '<p>Estimación principal de la app: <b>' + esc(D.modelo.principal || "Modelo de mercado") + '</b> (la que mejor predice el 1X2 en la prueba).</p>';
      ["1X2", "Más/Menos 2.5"].forEach(function (m) {
        var f = D.modelo.metricas.filter(function (r) { return r.mercado === m; });
        if (!f.length) return;
        var nref = (f.filter(function (r) { return r.fuente === "Mercado (cierre)"; })[0] || {}).n;
        h += '<h3>' + m + ' <span class="sub">' + (nref || "") + ' partidos</span></h3>' + tabla(["Fuente", "Log loss", "vs cierre", "¿Real?"],
          f.slice().sort(function (a, b) { return a.log_loss - b.log_loss; }).map(function (r) {
            var real = r.ic_lo == null ? "" : (r.ic_lo > 0 ? "peor" : r.ic_hi < 0 ? "mejor" : "empate");
            return [esc(r.fuente) + (r.fuente === D.modelo.principal ? " ★" : "") + (r.n !== nref ? ' <span class="sub">(' + r.n + ')</span>' : ""),
              num(r.log_loss, 4), r.dif_cierre == null ? "ref." : signo(r.dif_cierre, 4), real];
          }));
      });
      h += '<p class="sub">Lo normal es que todo quede algo peor que el cierre: el mercado incluye bajas, alineaciones y dinero informado. ' +
        'Si la apertura sale con menos partidos (entre paréntesis), es porque en algunas ligas no hay cuotas de apertura; su diferencia se mide solo en esos partidos.</p>';
    } else h += '<p class="sub">El modelo de mercado no está entrenado en esta actualización.</p>';
    h += '</div>';
    /* córners y tarjetas */
    var C = D.conteos || {};
    Object.keys(C).forEach(function (t) {
      var c = C[t];
      h += '<div class="card"><h2>' + esc(c.nombre) + ': ¿aporta el modelo?</h2><p class="sub">Prueba: ' + (c.test || []).map(nomTemp).join(" y ") + ' (' + c.n_test +
        ' partidos). Se compara con la referencia más simple: la frecuencia de la liga en las dos temporadas anteriores. Brier: menor = mejor.</p>' +
        tabla(["Más de", "Pasó", "Modelo dijo", "Mejora vs liga"], c.evaluacion.map(function (e) {
          return [e.linea, pct(e.frecuencia), pct(e.p_media_modelo), signo(100 * (e.brier_liga - e.brier_modelo) / e.brier_liga, 1) + " %"]; })) +
        '<p class="sub">Mejora = cuánto baja el error (Brier) frente a usar la frecuencia de la liga.</p>' +
        '<p class="sub">' + (t === "corners" ? "Mejora pequeña: los córners de un partido son muy aleatorios. Úsalo para descartar líneas mal puestas, no para buscar valor fino."
          : "Las tarjetas se predicen algo mejor (los equipos y las ligas tienen estilos estables), pero el árbitro pesa mucho y el modelo no lo incluye.") + '</p></div>';
    });
    /* ambos marcan */
    var R = reglaBtts();
    if (R) {
      var B = R.B, u = Math.round(100 * B.umbral_usuario);
      h += '<div class="card"><h2>Backtest: Ambos marcan si los dos superan el ' + u + ' %</h2>';
      if (R.prueba && R.prueba.n) {
        var pt = B.por_temporada.filter(function (x) { return B.prueba.indexOf(x.temporada) >= 0; });
        var pctPart = pt.reduce(function (s, x) { return s + x.modelo.n; }, 0) / Math.max(1, pt.reduce(function (s, x) { return s + x.partidos; }, 0));
        h += '<div class="veredicto neutro">En la prueba (' + B.prueba.map(nomTemp).join(" y ") + ') la regla se cumplió en el <b>' + pct(pctPart, 0) +
          '</b> de los partidos y acertó el <b>' + pct(R.prueba.acierto) + '</b> (base de la liga: ' + pct(B.base_prueba) + '). ' +
          'Cuota mínima para no perder: <b>' + num(R.prueba.cuota_min) + '</b> (IC 95 %: ' + num(R.prueba.cuota_min_lo) + '–' + num(R.prueba.cuota_min_hi) + '). ' +
          'Si la cuota media que coges a "Ambos marcan: Sí" es menor, la regla pierde dinero a la larga.</div>';
      }
      var porT = function (campo) { return tabla(["Temp.", "Base", "Señales", "Acierto", "Cuota mín."], B.por_temporada.map(function (x) {
        var mo = x[campo]; return [nomTemp(x.temporada) + (B.prueba.indexOf(x.temporada) >= 0 ? " 🧪" : ""), pct(x.base, 0),
          mo.n + " (" + pct(mo.pct_partidos, 0) + ")", pct(mo.acierto), num(mo.cuota_min)]; })); };
      h += '<h3>Por temporada · con el modelo</h3>' + porT("modelo") + '<h3>Por temporada · con % casa/fuera</h3>' + porT("casa_fuera") +
        '<p class="sub">🧪 = temporada de prueba. Base = % de partidos con ambos marcan. Señales = partidos en que se cumple la regla (y % del total). "Modelo" = probabilidad de marcar del rating de mercado. "Casa/fuera" = % de partidos de la temporada en que el local marcó en casa y el visitante fuera (mínimo 4).</p>';
      h += '<h3>¿Y con otro umbral? (prueba)</h3>' + tabla(["Umbral", "Señales", "Acierto", "Cuota mín."],
        B.barrido_equipo.map(function (x) { var p = x.prueba;
          return [Math.round(100 * x.umbral) + " %" + (Math.abs(x.umbral - B.umbral_usuario) < 1e-6 ? " ←" : ""), p.n, pct(p.acierto), num(p.cuota_min)]; }));
      h += '<h3>Alternativa: usar directamente P(ambos marcan)</h3>' + tabla(["P(ambos) ≥", "Señales", "Acierto", "Cuota mín."],
        B.barrido_btts.map(function (x) { return [Math.round(100 * x.umbral) + " %", x.prueba.n, pct(x.prueba.acierto, 0) + ' <span class="sub">(' + pct(x.desarrollo.acierto, 0) + ')</span>',
          num(x.prueba.cuota_min)]; })) + '<p class="sub">Acierto en la prueba y, entre paréntesis, en las temporadas de desarrollo: si se parecen, el patrón es estable. Con pocas señales (menos de ~300) no te fíes.</p>' +
        '<p class="sub">Subir el umbral da menos señales pero más acierto, y baja la cuota mínima. La regla que de verdad tiene sentido es: apuesta solo si la cuota que te dan supera la cuota justa del partido (📊 Variables te lo calcula).</p>';
      if (B.calibracion && B.calibracion.length) h += '<h3>Calibración de P(ambos marcan)</h3>' + tabla(["Tramo", "N", "Modelo dijo", "Pasó"],
        B.calibracion.map(function (x) { return [x.tramo, x.n, pct(x.p_media), pct(x.frecuencia)]; })) +
        '<p class="sub">Si "Pasó" queda por encima de "Modelo dijo", el modelo se queda corto en ese tramo.</p>';
      h += '<p class="sub">football-data no publica cuotas de Ambos marcan, así que el backtest no puede calcular beneficios: solo la cuota mínima. Para medir tu ROI real, registra cada apuesta con su cuota en 📊 Variables.</p></div>';
    }
    h += '<div class="card"><h3>Datos</h3><p class="sub">Actualizado: ' + esc(D.generado) + '<br>Resultados hasta: ' + fechaCorta(D.datos_hasta) +
      '<br>Ligas: ' + D.ligas.map(function (l) { return esc(l.nombre); }).join(", ") + '</p>';
    if (D.avisos && D.avisos.length) h += '<p class="aviso">Avisos de la última actualización:</p><ul>' + D.avisos.map(function (a) { return '<li class="sub">' + esc(a) + '</li>'; }).join("") + '</ul>';
    h += '<button class="btn sec" id="f-rec">Recargar datos</button></div>';
    return h;
  }

  /* ---------- navegación ---------- */
  function ir(tab, auto) {
    st.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) { b.classList.toggle("activo", b.dataset.tab === tab); });
    if (!D) return;
    var v = $("vista");
    if (tab === "jornada") { v.innerHTML = vistaJornada(); engancharJornada(); }
    else if (tab === "partido") { v.innerHTML = vistaPartido(); engancharPartido(auto || !!st.a); }
    else if (tab === "vars") { v.innerHTML = vistaVars(); engancharVars(auto || !!st.a); }
    else if (tab === "lab") { v.innerHTML = vistaLab(); engancharLab(); }
    else if (tab === "liga") { v.innerHTML = vistaLiga(); $("t-liga").onchange = function () { st.ligaTabla = this.value; ir("liga"); }; }
    else if (tab === "diario") { v.innerHTML = vistaDiario(); engancharDiario(); }
    else if (tab === "fiab") { v.innerHTML = vistaFiab(); $("f-rec").onclick = function () { cache = {}; cargar(); }; }
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) { b.onclick = function () { ir(this.dataset.tab); }; });
  window.__app = { st: st, ir: ir, registrar: registrar, liquidar: liquidar, diario: diario, apuestas: apuestas,
    liquidarApuestas: liquidarApuestas, datos: function () { return D; } };
  /* pide al navegador que no borre el diario por falta de espacio (si lo permite) */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* sin soporte */ }
  cargar();
})();
</script>
</body>
