<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#1c2833;--sub:#5d6d7e;--linea:#e5e8eb;--acento:#0f5132;

@media (prefers-color-scheme:dark){:root{--bg:#101418;--card:#1a2026;--txt:#e8ecef;--sub:#9aa7b3;--linea:#2b333b;--acento:#4cc38a}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--acento);color:#fff;

header h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 86px);max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--linea);

.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:17px;margin:0 0 6px}.card h3{font-size:15px;margin:12px 0 6px}
.sub{color:var(--sub);font-size:13px}
.aviso{color:var(--aviso)}.error{color:var(--mal);font-weight:600}
select,input[type=text],input[type=number]{width:100%;font-size:16px;padding:9px 10px;border-radius:10px;

label{font-size:13px;color:var(--sub)}
.fila{display:flex;gap:8px}.fila>*{flex:1;min-width:0}

button.peq{padding:7px 10px;font-size:13px;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--card);color:var(--txt);border-radius:16px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--acento);color:#fff;border-color:var(--acento)}

.partido b{font-size:15px}.partido .meta{font-size:12px;color:var(--sub)}
.badge{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--linea)}
.badge.alto{background:#fdebd0;color:#935116}
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--linea);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
.barras .grupo{margin:6px 0 10px}.barras .et{font-size:13px;font-weight:600;margin-bottom:2px}
.barra{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}
.barra .pista{flex:1;background:var(--linea);border-radius:5px;height:12px;overflow:hidden}
.barra .relleno{height:100%;border-radius:5px}
.barra .v{width:44px;text-align:right}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mapa{display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;font-size:11px}
.mapa div{text-align:center;padding:5px 0;border-radius:4px}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;margin:6px 0 2px}
.cols div{flex:1;background:#34495e;border-radius:4px 4px 0 0;position:relative}
.cols div.over{background:var(--mer)}
.cols div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub)}
.ejes{display:flex;gap:4px;font-size:11px;color:var(--sub)}.ejes span{flex:1;text-align:center}
.rango{margin:8px 0}.rango .cab{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;height:34px}
.forma span{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;color:#fff;
  font-size:12px;font-weight:700;margin-right:3px}
.V{background:#27ae60}.E{background:#f1c40f}.D{background:#c0392b}
.ok{color:#1e8449;font-weight:600}
svg text{fill:var(--txt)}

<body>
<header><h1>⚽ Análisis de fútbol</h1><p id="estado-datos">Cargando datos…</p></header>
<main id="vista"></main>
<nav id="nav">
  <button data-tab="jornada"><span>📅</span>Jornada</button>
  <button data-tab="partido"><span>🔍</span>Partido</button>
  <button data-tab="lab"><span>🎛️</span>Laboratorio</button>
  <button data-tab="liga"><span>🏆</span>Liga</button>
  <button data-tab="diario"><span>📝</span>Diario</button>
  <button data-tab="fiab"><span>✅</span>Fiabilidad</button>

<script id="motor">
/* ===================== MOTOR DE CÁLCULO (sin DOM) ===================== */
var Motor = (function () {
  var G = 11;
  function clip(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function pmf(lam) {
    var out = new Array(G), p = Math.exp(-lam);
    out[0] = p;
    for (var k = 1; k < G; k++) { p = p * lam / k; out[k] = p; }
    return out;
  }
  function matriz(ll, lv, rho) {
    var a = pmf(ll), b = pmf(lv), M = [], s = 0, i, j;
    for (i = 0; i < G; i++) { M.push(new Array(G)); for (j = 0; j < G; j++) M[i][j] = a[i] * b[j]; }
    if (rho) { M[0][0] *= 1 - ll * lv * rho; M[0][1] *= 1 + ll * rho; M[1][0] *= 1 + lv * rho; M[1][1] *= 1 - rho; }
    for (i = 0; i < G; i++) for (j = 0; j < G; j++) s += M[i][j];
    for (i = 0; i < G; i++) for (j = 0; j < G; j++) M[i][j] /= s;
    return M;
  }
  function suma(M, f) {
    var s = 0;
    for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) if (f(i, j)) s += M[i][j];
    return s;
  }
  function desglosar(M) {
    var p1 = suma(M, function (i, j) { return i > j; }), px = suma(M, function (i, j) { return i === j; }),
      p2 = suma(M, function (i, j) { return i < j; }), t = p1 + px + p2;
    return { p: [p1 / t, px / t, p2 / t], ov: suma(M, function (i, j) { return i + j >= 3; }) };
  }
  function mercados(M) {
    var f = function (fn) { return suma(M, fn); };
    var p1 = f(function (i, j) { return i > j; }), px = f(function (i, j) { return i === j; }), p2 = f(function (i, j) { return i < j; });
    var out = [["1X2", "Local", p1], ["1X2", "Empate", px], ["1X2", "Visitante", p2],
      ["Doble oportunidad", "1X", p1 + px], ["Doble oportunidad", "12", p1 + p2], ["Doble oportunidad", "X2", px + p2]];
    [0.5, 1.5, 2.5, 3.5, 4.5].forEach(function (l) {
      var pm = f(function (i, j) { return i + j > l; });
      out.push(["Goles totales", "Más de " + l, pm], ["Goles totales", "Menos de " + l, 1 - pm]);
    });
    var bt = f(function (i, j) { return i >= 1 && j >= 1; });
    out.push(["Ambos marcan", "Sí", bt], ["Ambos marcan", "No", 1 - bt]);
    [0.5, 1.5].forEach(function (l) { out.push(["Goles del local", "Más de " + l, f(function (i) { return i > l; })]); });
    [0.5, 1.5].forEach(function (l) { out.push(["Goles del visitante", "Más de " + l, f(function (i, j) { return j > l; })]); });
    out.push(["Portería a cero", "Local no encaja", f(function (i, j) { return j === 0; })],
      ["Portería a cero", "Visitante no encaja", f(function (i) { return i === 0; })],
      ["Margen", "Local gana por 2 o más", f(function (i, j) { return i - j >= 2; })],
      ["Margen", "Visitante gana por 2 o más", f(function (i, j) { return j - i >= 2; })]);
    return out;
  }
  function lambdas(fz, i, j) {
    return [clip(fz.mu_l * fz.att[i] * fz.dfn[j], 0.05, 6), clip(fz.mu_v * fz.att[j] * fz.dfn[i], 0.05, 6)];
  }
  function logc(p) { return Math.log(clip(p, 1e-6, 1)); }
  function softmax(sm, x) {
    var d = x.length, K = sm.W[0].length, z = [], k, i, m = -Infinity, s = 0;
    for (k = 0; k < K; k++) {
      var v = sm.W[d][k];
      for (i = 0; i < d; i++) v += ((x[i] - sm.mu[i]) / sm.sd[i]) * sm.W[i][k];
      z.push(v); if (v > m) m = v;
    }
    for (k = 0; k < K; k++) { z[k] = Math.exp(z[k] - m); s += z[k]; }
    return z.map(function (v) { return v / s; });
  }
  var _grid = null;
  function rejilla() {
    if (_grid) return _grid;
    var lam = [], k;
    for (k = 0; 0.15 + k * 0.02 < 4.52 - 1e-9; k++) lam.push(Math.round((0.15 + k * 0.02) * 100) / 100);
    var n = lam.length, LL = [], LV = [], P1 = [], P2 = [], PO = [];
    var pm = lam.map(pmf);
    for (var a = 0; a < n; a++) for (var b = 0; b < n; b++) {
      var A = pm[a], B = pm[b], p1 = 0, p2 = 0, po = 0, s = 0;
      for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) {
        var v = A[i] * B[j]; s += v;
        if (i > j) p1 += v; else if (i < j) p2 += v;
        if (i + j >= 3) po += v;
      }
      LL.push(lam[a]); LV.push(lam[b]); P1.push(p1 / s); P2.push(p2 / s); PO.push(po / s);
    }
    _grid = { LL: LL, LV: LV, P1: P1, P2: P2, PO: PO };
    return _grid;
  }
  function invertir(p1x2, pou) {
    var g = rejilla(), mejor = -1, dmin = Infinity, k, d, x, y;
    var conOU = pou && isFinite(pou[0]);
    for (k = 0; k < g.LL.length; k++) {
      if (conOU) { x = g.P1[k] - g.P2[k] - (p1x2[0] - p1x2[2]); y = g.PO[k] - pou[0]; }
      else { x = g.P1[k] - p1x2[0]; y = g.P2[k] - p1x2[2]; }
      d = x * x + y * y;
      if (d < dmin) { dmin = d; mejor = k; }
    }
    return [g.LL[mejor], g.LV[mejor]];
  }
  function descanso(D, liga, eq, fecha) {
    var u = D.ultimo_partido[liga] && D.ultimo_partido[liga][eq];
    if (!u) return 7;
    var d = (Date.parse(fecha) - Date.parse(u)) / 864e5;
    if (!(d > 0)) return 7;
    return clip(d, 2, 21);
  }
  function fixture(D, liga, local, visitante) {
    for (var k = 0; k < D.proximos.length; k++) {
      var f = D.proximos[k];
      if (f.liga === liga && f.local === local && f.visitante === visitante && f.fecha >= D.hoy) return f;
    }
    return null;
  }
  function recientes(D, liga, eq) {
    var desde = new Date(Date.parse(D.hoy) - 365 * 864e5).toISOString().slice(0, 10), n = 0;
    D.partidos.forEach(function (p) { if (p[0] === liga && p[1] >= desde && (p[2] === eq || p[3] === eq)) n++; });
    return n;
  }
  function analizar(D, liga, local, visitante, fecha) {
    if (local === visitante) throw new Error("Elige dos equipos distintos.");
    var F = D.fuerzas[liga];
    if (!F || !F.gol) throw new Error("Histórico insuficiente para esta liga.");
    var i = F.equipos.indexOf(local), j = F.equipos.indexOf(visitante), avisos = [];
    [[local, i], [visitante, j]].forEach(function (t) {
      if (t[1] < 0) throw new Error(t[0] + ": no aparece en el histórico (¿recién ascendido o nombre distinto?).");
      if (F.gol.n[t[1]] < D.parametros.min_partidos) throw new Error(t[0] + ": solo " + F.gol.n[t[1]] + " partidos en el histórico.");
      var r = recientes(D, liga, t[0]);
      if (r < 10) avisos.push(t[0] + ": solo " + r + " partidos en el último año (¿recién ascendido?). Estimación poco fiable.");
    });
    var fx = fixture(D, liga, local, visitante);
    fecha = fecha || (fx ? fx.fecha : D.hoy);
    var rho = D.parametros.rho_goles, fuentes = {}, orden = [];
    var lg = lambdas(F.gol, i, j), dg = desglosar(matriz(lg[0], lg[1], rho));
    fuentes["Modelo de goles"] = { p: dg.p, ov: dg.ov, lam: lg }; orden.push("Modelo de goles");
    if (F.mkt) {
      var lr = lambdas(F.mkt, i, j), dr = desglosar(matriz(lr[0], lr[1], 0));
      fuentes["Rating de mercado"] = { p: dr.p, ov: dr.ov, lam: lr }; orden.push("Rating de mercado");
      var mod = D.modelo;
      if (mod && mod.softmax && mod.softmax["1x2"] && mod.ligas.indexOf(liga) >= 0) {
        var dl = descanso(D, liga, local, fecha), dv = descanso(D, liga, visitante, fecha);
        var dum = mod.ligas.map(function (c) { return c === liga ? 1 : 0; });
        var x1 = dg.p.map(logc).concat(dr.p.map(logc), [Math.log(Math.max(dl, 1)), Math.log(Math.max(dv, 1))], dum);
        var pmm = softmax(mod.softmax["1x2"], x1), po = null;
        if (mod.softmax.ou) {
          var x2 = [dg.ov, 1 - dg.ov].map(logc).concat([dr.ov, 1 - dr.ov].map(logc),
            [Math.log(Math.max(dl, 1)), Math.log(Math.max(dv, 1))], dum);
          po = softmax(mod.softmax.ou, x2);
        }
        fuentes["Modelo de mercado"] = { p: pmm, ov: po ? po[0] : null, lam: invertir(pmm, po) };
        orden.push("Modelo de mercado");
      }
    }
    if (fx && fx.mer1x2) {
      fuentes["Mercado (cuotas)"] = { p: fx.mer1x2, ov: fx.merou ? fx.merou[0] : null,
        lam: invertir(fx.mer1x2, fx.merou), b365: fx.b365, b365ou: fx.b365ou };
      orden.push("Mercado (cuotas)");
    }
    var principal = fuentes["Modelo de mercado"] ? "Modelo de mercado" : (fuentes["Rating de mercado"] ? "Rating de mercado" : "Modelo de goles");
    var lp = fuentes[principal].lam;
    return { liga: liga, local: local, visitante: visitante, fecha: fecha, fuentes: fuentes, orden: orden,
      principal: principal, avisos: avisos, fixture: fx, M: matriz(lp[0], lp[1], principal === "Modelo de goles" ? rho : 0) };
  }
  return { matriz: matriz, desglosar: desglosar, mercados: mercados, lambdas: lambdas, softmax: softmax,
    invertir: invertir, descanso: descanso, analizar: analizar, fixture: fixture, G: G };
})();
if (typeof module !== "undefined") module.exports = Motor;
</script>

<script id="app">
/* ===================== INTERFAZ ===================== */
(function () {
  var D = null, cache = {};
  var COL = { "Modelo de goles": "var(--goles)", "Rating de mercado": "var(--rating)", "Modelo de mercado": "var(--mm)",
    "Mercado (cuotas)": "var(--mer)", "Tu estimación": "var(--tu)" };
  var st = { tab: "jornada", filtro: "todas", liga: null, local: null, visitante: null, a: null,
    lab: { ll: 1.4, lv: 1.1, rho: -0.10 }, labA: null, ligaTabla: null };
  var CLAVE = "futbol_diario_v1";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(x, d) { return x == null || !isFinite(x) ? "—" : (100 * x).toFixed(d == null ? 1 : d) + " %"; }
  function cuota(p) { return !p || !isFinite(p) ? "—" : (1 / p).toFixed(2); }
  function fechaCorta(f) { var p = f.split("-"); return p[2] + "/" + p[1]; }
  function nombreLiga(c) { var l = D.ligas.filter(function (x) { return x.cod === c; })[0]; return l ? l.nombre : c; }
  function ligaDe(c) { return D.ligas.filter(function (x) { return x.cod === c; })[0]; }

  /* ---------- carga ---------- */
  function cargar() {
    fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) {
      D = d;
      $("estado-datos").textContent = "Datos hasta " + fechaCorta(d.datos_hasta) + " · actualizado " + d.generado;
      st.liga = d.ligas[0].cod; st.ligaTabla = st.liga;
      var eq = ligaDe(st.liga).equipos_temporada; st.local = eq[0]; st.visitante = eq[1];
      liquidar();
      ir(st.tab);
    }).catch(function (e) {
      $("estado-datos").textContent = "Sin datos";
      $("vista").innerHTML = '<div class="card"><h2>No se pudieron cargar los datos</h2><p class="error">' + esc(e.message) +
        '</p><p class="sub">Si acabas de crear la app, espera a que el robot termine su primera ejecución (pestaña Actions de GitHub) y recarga.</p></div>';
    });
  }
  function analisis(liga, l, v) {
    var k = liga + "|" + l + "|" + v;
    if (!cache[k]) cache[k] = Motor.analizar(D, liga, l, v);
    return cache[k];
  }

  /* ---------- componentes ---------- */
  function barras(series, etiquetas) {
    var nombres = Object.keys(series), h = '<div class="barras">';
    etiquetas.forEach(function (et, k) {
      h += '<div class="grupo"><div class="et">' + et + '</div>';
      nombres.forEach(function (n) {
        var v = series[n][k];
        h += '<div class="barra"><div class="pista"><div class="relleno" style="width:' + Math.max(0, Math.min(100, 100 * v)) +
          '%;background:' + (COL[n] || "#95a5a6") + '"></div></div><div class="v">' + (100 * v).toFixed(1) + '</div></div>';
      });
      h += '</div>';
    });
    return h + '</div><div class="leyenda">' + nombres.map(function (n) {
      return '<span><i style="background:' + (COL[n] || "#95a5a6") + '"></i>' + n + '</span>'; }).join("") + '</div>';
  }
  function tabla(cab, filas) {
    return '<div class="tabla"><table><tr>' + cab.map(function (c) { return '<th>' + c + '</th>'; }).join("") + '</tr>' +
      filas.map(function (f) { return '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join("") + '</tr>'; }).join("") +
      '</table></div>';
  }
  function mapaMarcadores(M) {
    var n = 7, max = 0, i, j;
    for (i = 0; i < n; i++) for (j = 0; j < n; j++) max = Math.max(max, M[i][j]);
    var h = '<div class="mapa"><div></div>';
    for (j = 0; j < n; j++) h += '<div class="sub">' + j + '</div>';
    for (i = 0; i < n; i++) {
      h += '<div class="sub">' + i + '</div>';
      for (j = 0; j < n; j++) {
        var v = M[i][j], a = v / max;
        h += '<div style="background:rgba(41,128,185,' + (0.08 + 0.85 * a).toFixed(2) + ');color:' + (a > 0.55 ? "#fff" : "inherit") +
          '">' + (100 * v >= 0.35 ? (100 * v).toFixed(1) : "") + '</div>';
      }
    }
    return h + '</div><p class="sub">Filas: goles del local · columnas: goles del visitante (% de cada marcador).</p>';
  }
  function columnasGoles(M) {
    var tot = [], i, j, max = 0;
    for (var g = 0; g < 9; g++) { var s = 0; for (i = 0; i <= g && i < Motor.G; i++) { j = g - i; if (j < Motor.G) s += M[i][j]; } tot.push(s); max = Math.max(max, s); }
    return '<div class="cols">' + tot.map(function (v, g) {

  function opcionesLigas(sel) {

  /* ---------- forma y cara a cara ---------- */

  function resumen(lista, et) {

  function bloqueForma(liga, eq, esLocal) {

    return h;
  }
  function caraACara(liga, a, b) {

  /* ---------- vistas ---------- */

  }
  function tablaComparacion(a, p, ov) {

  /* ---------- laboratorio ---------- */

  /* ---------- liga ---------- */
  function vistaLiga() {
    var liga = st.ligaTabla, L = ligaDe(liga), F = D.fuerzas[liga];
    var h = '<div class="card"><label>Liga</label><select id="t-liga">' + opcionesLigas(liga) + '</select></div>';
    var fil = {};
    D.partidos.forEach(function (p) {
      if (p[0] !== liga || p[8] !== L.temporada) return;
      [[p[2], p[4], p[5]], [p[3], p[5], p[4]]].forEach(function (x) {
        var e = fil[x[0]] || (fil[x[0]] = { e: x[0], pj: 0, v: 0, em: 0, d: 0, gf: 0, gc: 0 });
        e.pj++; e.gf += x[1]; e.gc += x[2];
        if (x[1] > x[2]) e.v++; else if (x[1] === x[2]) e.em++; else e.d++;
      });
    });
    var t = Object.keys(fil).map(function (k) { var e = fil[k]; e.pts = 3 * e.v + e.em; e.dg = e.gf - e.gc; return e; });
    t.sort(function (a, b) { return b.pts - a.pts || b.dg - a.dg || b.gf - a.gf; });
    var fz = F.mkt || F.gol, fuerza = {};
    F.equipos.forEach(function (e, i) { fuerza[e] = Math.log(fz.att[i] / fz.dfn[i]); });
    var orden = Object.keys(fuerza).filter(function (e) { return fil[e]; }).sort(function (a, b) { return fuerza[b] - fuerza[a]; });
    h += '<div class="card"><h2>Clasificación ' + esc(L.temporada_nombre || (L.temporada.slice(0, 2) + '/' + L.temporada.slice(2))) + '</h2>' +
      tabla(["#", "Equipo", "PJ", "V", "E", "D", "GF", "GC", "DG", "Pts", "Fuerza*"], t.map(function (e, k) {
        return [k + 1, esc(e.e), e.pj, e.v, e.em, e.d, e.gf, e.gc, e.dg, "<b>" + e.pts + "</b>", orden.indexOf(e.e) + 1]; })) +
      '<p class="sub">* Puesto según la fuerza estimada por el ' + (F.mkt ? "rating de mercado" : "modelo de goles") +
      '. Mucho mejor en la tabla que en fuerza = posible buena suerte; al revés, candidato a remontar.</p></div>';
    h += '<div class="card"><h2>Mapa de fuerzas</h2>' + dispersion(F, fz, Object.keys(fil)) + '</div>';
    return h;
  }
  function dispersion(F, fz, activos) {
    var pts = [];
    F.equipos.forEach(function (e, i) { if (activos.indexOf(e) >= 0) pts.push([e, fz.att[i], fz.dfn[i]]); });
    if (!pts.length) return '<p class="sub">Sin datos.</p>';
    var xs = pts.map(function (p) { return p[1]; }), ys = pts.map(function (p) { return p[2]; });
    var x0 = Math.min.apply(null, xs.concat([1])) - 0.08, x1 = Math.max.apply(null, xs.concat([1])) + 0.08;
    var y0 = Math.min.apply(null, ys.concat([1])) - 0.08, y1 = Math.max.apply(null, ys.concat([1])) + 0.08;
    var W = 340, H = 300, px = function (x) { return 30 + (x - x0) / (x1 - x0) * (W - 40); },
      py = function (y) { return 10 + (y - y0) / (y1 - y0) * (H - 40); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:520px">' +
      '<line x1="' + px(1) + '" y1="10" x2="' + px(1) + '" y2="' + (H - 30) + '" stroke="#bbb" stroke-dasharray="3"/>' +
      '<line x1="30" y1="' + py(1) + '" x2="' + (W - 10) + '" y2="' + py(1) + '" stroke="#bbb" stroke-dasharray="3"/>';
    pts.forEach(function (p) {
      s += '<circle cx="' + px(p[1]).toFixed(1) + '" cy="' + py(p[2]).toFixed(1) + '" r="4" fill="#2980b9"/>' +
        '<text x="' + (px(p[1]) + 5).toFixed(1) + '" y="' + (py(p[2]) - 4).toFixed(1) + '" font-size="8.5">' + esc(p[0].slice(0, 13)) + '</text>';
    });
    s += '<text x="' + (W / 2) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle">Ataque → (marca más)</text>' +
      '<text x="10" y="' + (H / 2) + '" font-size="10" text-anchor="middle" transform="rotate(-90 10 ' + (H / 2) + ')">↓ Defensa (encaja menos arriba)</text></svg>';
    return s + '<p class="sub">Arriba a la derecha: los mejores (marcan mucho y encajan poco). La línea discontinua es la media de la liga.</p>';
  }

  /* ---------- diario ---------- */
  function diario() { try { return JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) { return []; } }
  function guardarDiario(d) { localStorage.setItem(CLAVE, JSON.stringify(d)); }
  function registrar(a, p, ov, nota) {
    var d = diario(), id = a.fecha + "|" + a.liga + "|" + a.local + "|" + a.visitante, prev = -1;
    d.forEach(function (x, k) { if (x.id === id) prev = k; });
    if (prev >= 0 && d[prev].estado === "LIQUIDADO") return "no guardado: ese partido ya está liquidado";
    var g = a.fuentes["Modelo de goles"], mm = a.fuentes["Modelo de mercado"], me = a.fuentes["Mercado (cuotas)"];
    var e = { id: id, registrado: new Date().toISOString().slice(0, 16).replace("T", " "), fecha: a.fecha, liga: a.liga,
      local: a.local, visitante: a.visitante, mi: p, mi_over: ov, nota: nota || "", mod: g.p, mod_over: g.ov,
      mm: mm ? mm.p : null, mm_over: mm ? mm.ov : null, mer: me ? me.p : null, mer_over: me ? me.ov : null,
      estado: "PENDIENTE", gl: null, gv: null };
    if (prev >= 0) d[prev] = e; else d.push(e);
    guardarDiario(d);
    return prev >= 0 ? "actualizado" : "guardado";
  }
  function liquidar() {
    if (!D) return 0;
    var d = diario(), n = 0;
    d.forEach(function (e) {
      if (e.estado !== "PENDIENTE") return;
      for (var k = 0; k < D.partidos.length; k++) {
        var p = D.partidos[k];
        if (p[0] === e.liga && p[2] === e.local && p[3] === e.visitante &&
          Math.abs(Date.parse(p[1]) - Date.parse(e.fecha)) <= 3 * 864e5) { e.estado = "LIQUIDADO"; e.gl = p[4]; e.gv = p[5]; n++; break; }
      }
    });
    if (n) guardarDiario(d);
    return n;
  }
  function puntuar(liq, campo) {
    var ll = [], br = [], ac = 0, n = 0;
    liq.forEach(function (e) {
      var p = e[campo]; if (!p) return;
      var y = e.gl > e.gv ? 0 : (e.gl === e.gv ? 1 : 2);
      ll.push(-Math.log(Math.max(p[y], 1e-9)));
      br.push(p.reduce(function (s, v, k) { return s + Math.pow(v - (k === y ? 1 : 0), 2); }, 0));
      if (p.indexOf(Math.max.apply(null, p)) === y) ac++; n++;
    });
    var m = function (a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; };
    return n ? { n: n, ll: m(ll), br: m(br), ac: ac / n, vals: ll } : null;
  }
  function vistaDiario() {
    var n = liquidar(), d = diario(), liq = d.filter(function (e) { return e.estado === "LIQUIDADO"; }), h = "";
    h += '<div class="card"><h2>Mi diario</h2><p class="sub">' + d.length + ' pronósticos · ' + liq.length + ' liquidados' +
      (n ? ' (' + n + ' liquidados ahora)' : '') + '. Se liquidan solos cuando el robot trae los resultados.</p>' +
      '<p class="sub">Para registrar: 🔍 Partido → 🎛️ Laboratorio → Guardar. Registra también los partidos en los que coincides con el modelo, no solo los dudosos.</p></div>';
    if (liq.length) {
      var fuentes = [["Tú", "mi"], ["Modelo de goles", "mod"], ["Modelo de mercado", "mm"], ["Mercado (cuotas)", "mer"]], filas = [];
      fuentes.forEach(function (f) { var r = puntuar(liq, f[1]); if (r) filas.push([f[0], r.n, r.ll.toFixed(4), r.br.toFixed(4), Math.round(100 * r.ac) + " %"]); });
      h += '<div class="card"><h3>¿Quién predice mejor? (menor = mejor)</h3>' + tabla(["Quién", "Partidos", "Log loss", "Brier", "Acierta favorito"], filas);
      [["Mercado (cuotas)", "mer"], ["Modelo de mercado", "mm"]].forEach(function (f) {
        var comunes = liq.filter(function (e) { return e[f[1]]; });
        if (comunes.length < 30) { h += '<p class="sub">Tú vs ' + f[0] + ': ' + comunes.length + ' partidos comparables. Con menos de 30, cualquier diferencia es casi siempre ruido.</p>'; return; }
        var a = puntuar(comunes, "mi").vals, b = puntuar(comunes, f[1]).vals, dif = a.map(function (v, k) { return v - b[k]; });
        var sem = 7, rnd = function () { sem = (sem * 16807) % 2147483647; return sem / 2147483647; }, medias = [];
        for (var r = 0; r < 2000; r++) { var s = 0; for (var k = 0; k < dif.length; k++) s += dif[Math.floor(rnd() * dif.length)]; medias.push(s / dif.length); }
        medias.sort(function (x, y) { return x - y; });
        var lo = medias[50], hi = medias[1949], md = dif.reduce(function (x, y) { return x + y; }, 0) / dif.length;
        h += '<p>Tú vs ' + f[0] + ' (' + dif.length + ' partidos): ' + (md > 0 ? "+" : "") + md.toFixed(4) + ' [IC 95 %: ' + lo.toFixed(4) + ', ' + hi.toFixed(4) + '] → <b>' +
          (hi < 0 ? "eres mejor (significativo)" : lo > 0 ? "eres peor (significativo)" : "no se distingue (puede ser suerte)") + '</b></p>';
      });
      var tramos = [[0, .2], [.2, .4], [.4, .6], [.6, .8], [.8, 1.01]], cal = [];
      tramos.forEach(function (t) {
        var ps = [], os = [];
        liq.forEach(function (e) { var y = e.gl > e.gv ? 0 : (e.gl === e.gv ? 1 : 2);
          e.mi.forEach(function (p, k) { if (p >= t[0] && p < t[1]) { ps.push(p); os.push(k === y ? 1 : 0); } }); });
        if (ps.length) cal.push([Math.round(100 * t[0]) + "–" + Math.min(100, Math.round(100 * t[1])) + " %", pct(ps.reduce(function (a, b) { return a + b; }, 0) / ps.length),
          pct(os.reduce(function (a, b) { return a + b; }, 0) / os.length), ps.length]);
      });
      h += '<h3>Tu calibración</h3>' + tabla(["Tramo", "Lo que dijiste", "Lo que pasó", "N"], cal) +
        '<p class="sub">Si "lo que pasó" queda sistemáticamente por debajo de lo que dijiste, eres demasiado optimista en ese tramo.</p></div>';
    }
    h += '<div class="card"><h3>Pronósticos</h3>' + (d.length ? tabla(["Fecha", "Partido", "Tú 1-X-2", "Mercado", "Resultado", ""],
      d.slice().reverse().map(function (e) {
        return [fechaCorta(e.fecha), esc(e.local) + " – " + esc(e.visitante),
          e.mi.map(function (x) { return Math.round(100 * x); }).join("/"),
          e.mer ? e.mer.map(function (x) { return Math.round(100 * x); }).join("/") : "—",
          e.estado === "LIQUIDADO" ? e.gl + "-" + e.gv : '<span class="sub">pendiente</span>',
          '<button class="btn sec peq" data-borrar="' + esc(e.id) + '">✕</button>'];
      })) : '<p class="sub">Aún no hay pronósticos.</p>') + '</div>';
    h += '<div class="card"><h3>Copia de seguridad</h3><p class="sub">El diario se guarda en este iPhone. Haz una copia de vez en cuando.</p>' +
      '<div class="fila"><button class="btn sec peq" id="d-exp">Exportar</button><button class="btn sec peq" id="d-imp">Importar</button></div>' +
      '<input type="file" id="d-arch" accept=".json,application/json" style="display:none"><div id="d-msg"></div></div>';
    return h;
  }
  function engancharDiario() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-borrar]"), function (b) {
      b.onclick = function () {
        if (!confirm("¿Borrar este pronóstico?")) return;
        var id = this.dataset.borrar; guardarDiario(diario().filter(function (e) { return e.id !== id; })); ir("diario");
      };
    });
    $("d-exp").onclick = function () {
      var blob = new Blob([JSON.stringify(diario(), null, 1)], { type: "application/json" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "diario_futbol_" + D.hoy + ".json"; document.body.appendChild(a); a.click(); a.remove();
    };
    $("d-imp").onclick = function () { $("d-arch").click(); };
    $("d-arch").onchange = function () {
      var f = this.files[0]; if (!f) return; var r = new FileReader();
      r.onload = function () {
        try {
          var nuevos = JSON.parse(r.result); if (!Array.isArray(nuevos)) throw new Error("formato no válido");
          var d = diario(), ids = d.map(function (e) { return e.id; }), n = 0;
          nuevos.forEach(function (e) { if (e && e.id && ids.indexOf(e.id) < 0) { d.push(e); n++; } });
          guardarDiario(d); $("d-msg").innerHTML = '<p class="ok">Importados ' + n + ' pronósticos.</p>'; setTimeout(function () { ir("diario"); }, 900);
        } catch (e) { $("d-msg").innerHTML = '<p class="error">No se pudo importar: ' + esc(e.message) + '</p>'; }
      };
      r.readAsText(f);
    };
  }

  /* ---------- fiabilidad ---------- */
  function vistaFiab() {
    var h = '<div class="card"><h2>¿Cuánto se acerca cada estimación al mercado?</h2>';
    if (D.modelo && D.modelo.metricas) {
      var info = D.modelo.info || {};
      h += '<p class="sub">Temporada de prueba ' + esc(info.test || "?") + ', que no se usó para entrenar. Log loss: menor = mejor. El objetivo es que el modelo de mercado quede pegado al mercado de cierre.</p>';
      ["1X2", "Más/Menos 2.5"].forEach(function (m) {
        var f = D.modelo.metricas.filter(function (r) { return r.mercado === m; }).sort(function (a, b) { return a.log_loss - b.log_loss; });
        if (!f.length) return;
        var min = f[0].log_loss, max = f[f.length - 1].log_loss;
        h += '<h3>' + m + '</h3>' + f.map(function (r) {
          var w = 15 + 85 * (max > min ? (r.log_loss - min) / (max - min) : 0),
            c = r.fuente.indexOf("Modelo de mercado") >= 0 ? "var(--mm)" : r.fuente.indexOf("Mercado") >= 0 ? "var(--mer)" : "var(--goles)";
          return '<div class="barra"><div style="width:130px;font-size:12px">' + esc(r.fuente) + '</div><div class="pista"><div class="relleno" style="width:' + w + '%;background:' + c + '"></div></div><div class="v" style="width:56px">' + r.log_loss.toFixed(4) + '</div></div>';
        }).join("");
      });
    } else h += '<p class="sub">El modelo de mercado no está entrenado en esta actualización.</p>';
    h += '</div><div class="card"><h3>Datos</h3><p class="sub">Actualizado: ' + esc(D.generado) + '<br>Resultados hasta: ' + fechaCorta(D.datos_hasta) +
      '<br>Ligas: ' + D.ligas.map(function (l) { return esc(l.nombre); }).join(", ") + '</p>';
    if (D.avisos && D.avisos.length) h += '<p class="aviso">Avisos de la última actualización:</p><ul>' + D.avisos.map(function (a) { return '<li class="sub">' + esc(a) + '</li>'; }).join("") + '</ul>';
    h += '<button class="btn sec" id="f-rec">Recargar datos</button></div>';
    return h;
  }

  /* ---------- navegación ---------- */
  function ir(tab, auto) {
    st.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) { b.classList.toggle("activo", b.dataset.tab === tab); });
    if (!D) return;
    var v = $("vista");
    if (tab === "jornada") { v.innerHTML = vistaJornada(); engancharJornada(); }
    else if (tab === "partido") { v.innerHTML = vistaPartido(); engancharPartido(auto || !!st.a); }
    else if (tab === "lab") { v.innerHTML = vistaLab(); engancharLab(); }
    else if (tab === "liga") { v.innerHTML = vistaLiga(); $("t-liga").onchange = function () { st.ligaTabla = this.value; ir("liga"); }; }
    else if (tab === "diario") { v.innerHTML = vistaDiario(); engancharDiario(); }
    else if (tab === "fiab") { v.innerHTML = vistaFiab(); $("f-rec").onclick = function () { cache = {}; cargar(); }; }
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) { b.onclick = function () { ir(this.dataset.tab); }; });
  window.__app = { st: st, ir: ir, registrar: registrar, liquidar: liquidar, diario: diario, datos: function () { return D; } };
  cargar();
})();
</script>
</body>
</html>
